# Load-balances the 3 app replicas.
#
# Sticky by login cookie: the AI job queue lives in each replica's memory
# (LLM_ASYNC=1), so a participant's job submit and its polls must reach the same
# replica. Round-robin sends 2 of 3 polls to the wrong replica (404 → resubmit →
# fallback text). This matches the live server since the July load tests
# (docs/loadtest/reports/llm_queue_fix_*). Check the live file before replacing it:
#   sudo grep -n "hash" /etc/nginx/conf.d/lg-magazine-upstream.conf
upstream lg_magazine {
    hash $cookie_qrius_session consistent;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:3004 max_fails=3 fail_timeout=15s;
    keepalive 64;
}
